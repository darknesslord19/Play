name: Build CloudStream CS3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          ./gradlew :Tavsiyefilmizle:tasks --all

      - name: Build CS3
        run: ./gradlew :Tavsiyefilmizle:make --stacktrace --no-daemon

      - name: Locate CS3
        run: |
          echo "Generated CS3 files:"
          find . -type f -name '*.cs3' -print
          test -n "$(find . -type f -name '*.cs3' -print -quit)"

      - name: Publish builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/builds
          git fetch origin builds:refs/remotes/origin/builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add -B builds /tmp/builds origin/builds
          else
            mkdir -p /tmp/builds
            cd /tmp/builds
            git init
            git checkout --orphan builds
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          find /tmp/builds -maxdepth 1 -type f -name '*.cs3' -delete
          find "$GITHUB_WORKSPACE" -type f -name '*.cs3' -exec cp {} /tmp/builds/ \;
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('/tmp/builds'); repo=os.environ['GITHUB_REPOSITORY']
          items=[]
          for p in sorted(root.glob('*.cs3')):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              items.append({
                'name':p.stem,
                'internalName':p.stem,
                'url':f'https://raw.githubusercontent.com/{repo}/builds/{p.name}',
                'repositoryUrl':f'https://github.com/{repo}',
                'version':1,
                'status':1,
                'apiVersion':1,
                'fileSize':p.stat().st_size,
                'fileHash':'sha256-'+h,
                'language':'tr',
                'authors':[repo.split('/')[0]],
                'tvTypes':['Movie','TvSeries']
              })
          (root/'plugins.json').write_text(json.dumps(items,ensure_ascii=False,indent=2)+'
',encoding='utf-8')
          (root/'repo.json').write_text(json.dumps({
            'name':'Darknes Lord Play','description':'CloudStream providers repository','manifestVersion':1,
            'pluginLists':[f'https://raw.githubusercontent.com/{repo}/builds/plugins.json']
          },ensure_ascii=False,indent=2)+'
',encoding='utf-8')
          PY
          cd /tmp/builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build CS3 plugins" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:builds
