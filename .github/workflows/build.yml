name: Build CloudStream CS3

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore: ["**/*.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew make --stacktrace

      - name: Publish CS3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/builds
          git fetch origin builds:refs/remotes/origin/builds || true
          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git worktree add -B builds /tmp/builds origin/builds
          else
            mkdir -p /tmp/builds
            cd /tmp/builds
            git init
            git checkout --orphan builds
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          find /tmp/builds -maxdepth 1 -name '*.cs3' -type f -delete
          find "${GITHUB_WORKSPACE}" -mindepth 2 -path '*/build/*.cs3' -type f -exec cp {} /tmp/builds/ \;

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path('/tmp/builds')
          repo=os.environ['GITHUB_REPOSITORY']
          source=Path(os.environ['GITHUB_WORKSPACE'])/'plugins.json'
          old=[]
          if source.exists():
              try: old=json.loads(source.read_text(encoding='utf-8'))
              except: old=[]
          old={x.get('internalName'):x for x in old if isinstance(x,dict) and x.get('internalName')}
          out=[]
          for p in sorted(root.glob('*.cs3')):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              x=dict(old.get(p.stem,{}))
              x.update({
                'url':f'https://raw.githubusercontent.com/{repo}/builds/{p.name}?v={h}',
                'name':x.get('name',p.stem),
                'internalName':p.stem,
                'repositoryUrl':f'https://github.com/{repo}',
                'fileSize':p.stat().st_size,
                'fileHash':'sha256-'+h,
                'apiVersion':x.get('apiVersion',1),
                'status':x.get('status',1),
                'version':x.get('version',1)
              })
              x.setdefault('authors',[repo.split('/')[0]])
              x.setdefault('language','tr')
              x.setdefault('tvTypes',['Movie','TvSeries'])
              out.append(x)
          (root/'plugins.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cd /tmp/builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto build CS3" || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:builds
